name: 🔄 Zampto Auto-stan Renew-stan

on:
  schedule:
    # 北京 04:20
    - cron: '20 20 * * *'
    # 北京 16:00
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: Zampto_Renew-stan
      # 手动触发不取消正在跑的 run：新 run 排队等待，避免打断续期/签到半路
      cancel-in-progress: false
    env:
      #格式:email,password,tg_token,tg_chat
      ZAMPTO_BATCH: ${{ secrets.ZAMPTO_BATCH_STAN }}
      # 支持协议: vless, vmess, trojan, ss, hy2, tuic, anytls, socks5
      PROXY_CONTENT: ${{ secrets.ZAMPTO_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      SCREENSHOT_DIR: screenshots
      PROJECT_DIR: zampto-stan
      PRIVATE_REPO: doraemon6789/auto_zampto_private
      # hCaptcha 图片挑战视觉兜底（Groq 免费层，OpenAI 兼容接口；CLIP 解不了的常识/关系题走这里）
      ZAMPTO_VISION_KEY: ${{ secrets.ZAMPTO_VISION_KEY }}
      ZAMPTO_VISION_BASE: https://ma.dora.cc.cd/v1
      ZAMPTO_VISION_MODEL: wb1-sg/cn:glm-5.2
      # hCaptcha NoneCap 第三方求解直发通道（demo 移植；未配 key 自动跳过走旧 UI 流）
      HC_MODE: ${{ vars.HC_MODE || 'nc' }}
      NONECAP_API_KEY: ${{ secrets.NONECAP_API_KEY }}

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 CLIP 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/zampto_clip
          key: zampto-clip-v1

      - name: 安装系统依赖
        run: |
          # apt 源偶发 DNS 失败不应让整个 run 变红（run40 曾因 fonts-noto-cjk 拉不到而 exit 100）
          sudo apt-get update || echo "::warning::apt update 失败，继续"
          sudo apt-get install -y xvfb fonts-noto-cjk || \
            (echo "::warning::fonts-noto-cjk 安装失败，重试一次" && sleep 10 && \
             sudo apt-get install -y --fix-missing xvfb fonts-noto-cjk) || \
            echo "::warning::系统依赖安装失败，CJK 字体缺失仅影响截图文字渲染"
          command -v Xvfb >/dev/null && echo "Xvfb 就绪" || echo "::warning::Xvfb 缺失"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          fi
          # reCAPTCHA 语音挑战：识别 + 静态 ffmpeg（不装 apt 那一大坨）
          # audioop 在 Python 3.11 里还在标准库，audioop-lts 只给 3.13+ 用，别装
          pip install 'SpeechRecognition>=3.17.0' 'imageio-ffmpeg>=0.5,<1'
          # NoneCap 通道依赖（hcaptcha token 第三方求解 + HTTP/2）
          pip install 'httpx[http2]>=0.27.0'
          # hCaptcha 图片挑战本地 CLIP 分类
          pip install 'onnxruntime>=1.17.0' 'pillow>=10.0.0' 'numpy>=1.26.0'

      - name: 启用 WARP（验证码兜底出口）
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: ipv4
          mode: client

      - name: WARP 切 SOCKS5 代理模式
        run: |
          # 只作为"验证码过不去时"的备用出口，不接管全局路由：
          # proxy 模式在 127.0.0.1:40000 起一个 socks5，脚本按需把 sing-box
          # 的 outbound 指过去即可。
          sudo warp-cli --accept-tos disconnect 2>/dev/null || true
          sudo warp-cli --accept-tos mode proxy 2>/dev/null || true
          sudo warp-cli --accept-tos connect 2>/dev/null || true
          for i in $(seq 1 12); do
            if curl -s --max-time 6 -x socks5h://127.0.0.1:40000 https://api.ipify.org >/tmp/warp_ip.txt 2>/dev/null; then
              if [ -s /tmp/warp_ip.txt ]; then
                echo "[INFO] WARP 出口就绪: $(cat /tmp/warp_ip.txt)"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "[WARN] WARP 出口未就绪，续期遇到验证码时不会切换（不影响正常流程）"

      - name: 安装代理
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行续期
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          # 单次执行：本 workflow 一天多班（见 cron），失败由下一班自然重试，
          # 当日已成功的服务器由 state.enc 幂等跳过，无需 workflow 内循环等待。
          python -u zampto-renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zampto-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          # 并发安全提交：每次以最新远端为基准重建提交，重试 3 次；
          # 最终失败只告警不让 run 变红（time.txt 仅为保活元数据）
          #
          # 必须用 --mixed 而不是 --soft：脚本自己会提交 state.enc，若本次检出
          # 的树比远端旧（dispatch 刚推完就用旧 SHA 检出），--soft 会把旧树里
          # 的 state.enc 当成"改动"重新提交，把脚本刚写的当日状态回退掉。
          # --mixed 只把 index 对齐远端、保留工作区，随后只 add time.txt，
          # state.enc 永远不会被这个 step 提交。
          for _try in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add -f ${{ env.PROJECT_DIR }}/time.txt
            git diff --cached --quiet && { echo "无改动，跳过提交"; exit 0; }
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin HEAD:main; then
              echo "执行时间已提交"
              exit 0
            fi
            echo "第 $_try 次推送冲突，重取远端后重试"
            sleep 3
          done
          echo "::warning::time.txt 3 次推送均失败，本次未更新（不影响本次执行结果）"

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5

