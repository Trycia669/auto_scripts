name: 🔄  Loc Auto Sign

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      account_login:
        description: "强制用账号登录（跳过 cookie，测试 hCaptcha 打码用）"
        type: boolean
        default: false
  
  # 定时触发
  schedule:
    - cron: "02 00 * * *"

# 权限配置：允许提交和推送更改
permissions:
  contents: write
concurrency:
  group: loc-sign
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_DIR: loc
      SCRIPT_NAME: loc-sign.py
      SCRIPT_DESC: loc 签到脚本
    
    steps:
      # 步骤 1: 检出公开仓库
      - name: 📥 检出公开仓库
        uses: actions/checkout@v4
      
      # 步骤 1.5: 创建输出目录
      - name: 📁 创建输出目录
        run: |
          mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots

      # 步骤 2: 检出私有仓库
      - name: 🔐 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: doraemon6789/auto_loc_sign
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      # 步骤 2: 设置 Python 环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 步骤 3: 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk xdotool python3-tk

      # 步骤 4: 安装 Python 依赖
      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          # ⚠️ seleniumbase 钉 4.57.1：4.58.0 删掉了 UC 模式的 --disable-popup-blocking，
          #    uc_open_with_reconnect() 第二次调用时 window.open 被拦会直接崩（sb-checkin.yml 同款教训）。
          # pyautogui + xdotool 是 UC 真实鼠标点击过 hCaptcha 的依赖。
          pip install requests "seleniumbase==4.57.1" pyvirtualdisplay pyautogui PySocks PyNaCl
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ 无 requirements.txt，跳过"
          fi

      # 步骤 5: 安装 Hysteria2（如果需要代理）
      - name: 📡 安装 Hysteria2
        run: |
          if [ -n "${{ secrets.HY2_PROXY_URL }}" ]; then
            echo "安装 Hysteria2..."
            curl -L -o hysteria \
              https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64
            chmod +x hysteria
            sudo mv hysteria /usr/local/bin/hysteria
            hysteria version
            echo "✅ Hysteria2 安装完成"
          else
            echo "⚠️ 未配置代理，跳过 Hysteria2 安装"
          fi

      # 步骤 6: 添加随机延迟
      - name: ⏳ 添加随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      # 步骤 7: 执行脚本
      - name: 🚀 执行 ${{ env.SCRIPT_DESC }}
        env:
          LOC_BATCH: ${{ secrets.LOC_BATCH }}

          # ── 账号级 cookie：加密文件 cookies/<标识>.enc（推荐，不需要任何 PAT）──────────
          # 账号登录成功后会加密写回 cookies/<标识>.enc，并由 action 直接 push 回本私库；
          # 下次运行自动「读文件 → 解密 → 校验身份 → 接口签到」，不再碰 hCaptcha。
          # 密钥只存在这个 secret 里；丢了就重新账号登录一次（会自动生成新文件）。
          LOC_COOKIE_KEY: ${{ secrets.LOC_COOKIE_KEY }}

          # ── 兼容旧配置：明文 cookie secret（可留空，不设也完全能跑）──────────────
          # 形如 `yux666::nl_session=...; rc_t=...; lang=zh-Hans`，支持多行、多标识 `a|b::`。
          # 复制本 yml 到自己仓库时 secrets 不会跟着来，需各自设置自己的 LOC_BATCH / LOC_COOKIE_KEY。
          # LOC_COOKIE: ${{ secrets.LOC_COOKIE }}

          # 遗留：只有不用文件仓、又想自动回写 secret 时才需要 PAT（已不推荐）
          # LOC_SECRETS_PAT: ${{ secrets.LOC_SECRETS_PAT }}
          LOC_SECRETS_REPO: ${{ github.repository }}
          # hCaptcha 打码：默认走 NoneCap（与 zampto 同一套服务，key 复用 NONECAP_API_KEY）
          # 也可换 capsolver / 2captcha：把 CAPTCHA_PROVIDER 改掉并填 CAPTCHA_API_KEY
          CAPTCHA_PROVIDER: nonecap
          NONECAP_API_KEY: ${{ secrets.NONECAP_API_KEY }}
          NONECAP_BASE_URL: https://api.nonecap.com/v1
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          # 手动触发时可勾 account_login 强制走账号登录（测试打码链路，不读 cookie 文件）
          LOC_FORCE_ACCOUNT: ${{ inputs.account_login }}
          HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          SOCKS_PORT: ${{ secrets.SOCKS_PORT || '51080' }}
          SCREENSHOT_DIR: "screenshots"
        run: xvfb-run -a python ${{ env.SCRIPT_NAME }}
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}

      # 步骤 8: 上传截图
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_DIR }}-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots/
          retention-days: 7

      # 步骤 8.5: 清理本地截图
      - name: 🗑️ 清理本地截图
        if: always()
        run: |
          if [ -d "${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots" ]; then
            rm -rf ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/screenshots/*
            echo "✅ 本地截图已清理"
          fi

      # 步骤 9: 提交时间文件到公开库
      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p loc && echo "$(date +'%Y-%m-%d %H:%M:%S')" > loc/time.txt
          git add loc/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新 loc 执行时间: $TIMESTAMP"
            for _try in 1 2 3; do
              git fetch origin main
              if git push origin HEAD:main; then
                echo "✅ 更改已推送"
                exit 0
              fi
              echo "第 $_try 次推送被拒/失败，重试"
              git fetch origin main
              git reset --soft FETCH_HEAD
              sleep 3
            done
            echo "::warning::time.txt 3 次推送均失败，本次未更新（不影响本次执行结果）"
          fi

