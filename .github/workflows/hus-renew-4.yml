# =============================================================================
# 多账号说明：一个账号 = 一个 workflow 文件
# 本文件 = 第 ④ 个账号 | cron UTC 1:00 等三次| group Hus_Renew_4 | secret HUS_BATCH_LIW | 时间文件 hus/4/time.txt
# -----------------------------------------------------------------------------
# 结构：本文件 = 触发层（冻结）；_hus-renew-4.yml = 逻辑层（15–16 个步骤，跟着上游更新走）
#
# 要改的东西只有四样，都在本文件：
#   1. name:              改成本份的账号名（Actions 列表里靠它区分）
#   2. on.schedule 的 cron  改成本份的时间表（加一行 = 加一个时间点，完整 5 段 cron）
#   3. concurrency.group  改成唯一的，如 Hus_Renew_4        ★ 最容易漏的一条 ★
#                          → 不改：concurrency 是【仓库级、跨 workflow 共享】的，
#                            和别的份同名 → 所有 workflow 串行排队，并行收益直接归零
#   4. permissions        需要 push state 所以必须 contents: write（actions: write 用于清理旧 run）
#
# 不在本文件里的（都在 _hus-renew-4.yml，不要手改，拉上游更新即可）：
#   HUS_BATCH_N / TIME_DIR / 全部步骤 / artifact 名 / TG 报告格式
# =============================================================================
#   7. 本文件 = 触发层，只有 on / permissions / concurrency / uses 四块，冻结不再改。
#      想改执行时间 → 只改下面 on.schedule 里的 - cron: 行（加一行 = 加一个时间点）。
#      逻辑全部在 _hus-renew-4.yml（拉上游更新即可，不要手改）。
# =============================================================================

name: 🔄 Hus Auto Renew ④-liw

on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '50 2 * * *'
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略当日幂等，强制再跑一班（验证/调试用）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: Hus_Renew_4
  cancel-in-progress: false

jobs:
  renew:
    uses: ./.github/workflows/_hus-renew-4.yml
    secrets: inherit
    with:
      force: ${{ inputs.force && '1' || '0' }}
